# Laylaty Platform

منصة عربية متخصصة في تنظيم المناسبات وتقديم خدماتها من خلال ربط العميل بمقدمي الخدمات في واجهة موحدة. المشروع يركز على تجربة حجز الخدمات، إدارة المناسبات، متابعة الطلبات، والعمليات التشغيلية لمقدم الخدمة.

## ما الذي يتضمنه المشروع

- واجهة لوحة تحكم للعميل
- لوحة تحكم للتاجر ومقدم الخدمة
- لوحات إدارة الموردين والمتاجر
- كاشير/واجهة تشغيلية للصالون والخياطة
- لوحة إدارة مركزية للإدارة والعمليات
- تصميم عربي RTL متكامل ومناسب للمنصة السعودية/العربية

## Stack الحالي

- HTML5 + CSS3
- JavaScript أصلي
- Vite كأداة تنمية سريعة
- تصميم متجاوب ومتوافق مع الهاتف والسطح المكتب

## هيكل المشروع

```bash
.
├── index.html
├── package.json
├── README.md
├── src/
│   ├── main.js
│   └── styles.css
└── public/
```

## التشغيل محلياً

1. تثبيت الحزم:

```bash
npm install
```

2. تشغيل المشروع:

```bash
npm run dev -- --host
```

3. فتح المشروع في المتصفح على:

```bash
http://localhost:5173
```

## بناء المشروع للإنتاج

```bash
npm run build
```

## ملاحظات حول MVP

هذا المشروع يمثل نسخة أولية (MVP) من منصة ليلتي، مع تركيز على: 
- تجربة واجهة المستخدم
- تنظيم لوحات الإدارة
- عرض الخدمات والطلبات
- إظهار تدفق العمل بين العميل والتاجر والإدارة

## المرحلة القادمة

- ربط الواجهة بنظام backend
- إضافة مصادقة المستخدمين
- إدارة قاعدة بيانات PostgreSQL
- نظام حجوزات متقدم
- مدفوعات إلكترونية
- حسابات ومؤشرات تقارير ربحية

## النسب الحالية

المشروع الحالي يعمل كواجهة أولية قابلة للتطوير، وتصميمه مستند على مفهوم المنصة المقدم في ملف المرجع الخاص بـ Laylaty Platform.
