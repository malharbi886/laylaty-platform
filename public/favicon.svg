└── .gitignore
```

## التشغيل محلياً

1. تثبيت الحزم:

```bash
npm install
```

2. تشغيل المشروع بالكامل (خادم API + واجهة العميل):

```bash
npm run dev
```

3. الوصول إلى الواجهة:

```bash
http://localhost:5173
```

4. الوصول إلى API:

```bash
http://localhost:3001/api/health
```

## API endpoints

- `GET /api/health` → اختبار التشغيل
- `GET /api/dashboard?tab=customer` → جلب بيانات لوحة محددة
- `GET /api/orders` → جلب جميع الطلبات
- `POST /api/orders` → إنشاء طلب جديد

## مثال إنشاء طلب

```bash
curl -X POST http://localhost:3001/api/orders \
  -H "Content-Type: application/json" \
  -d '{
    "title": "طلب حفل زفاف",
    "customer": "أحمد محمد",
    "service": "قاعة أفراح",
    "amount": 2500,
    "status": "قيد التنفيذ"
  }'
```

## المرحلة التالية المقترحة

- نظام تسجيل دخول وقوائم مستخدمين
- إدارة المتاجر، المنتجات، والخدمات
- نظام دفع إلكتروني
- تقارير مالية
- لوحة إدارة كاملة للتاجر والمدير
- تطبيق موبايل أو واجهة متقدمة ثانية

## ملاحظة

المشروع الآن في مرحلة MVP عملية وقابلة للتطوير، وهو جاهز للتمديد إلى منصة كاملة وفق خطة Laylaty.
