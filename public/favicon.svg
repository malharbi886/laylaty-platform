# Laylaty Platform

منصة عربية متخصصة في تنظيم المناسبات وتقديم خدماتها من خلال ربط العميل بمقدمي الخدمات في واجهة موحدة. هذا المشروع يمثل نسخة MVP كاملة قابلة للتطوير إلى منصة حقيقية للتغطية الكاملة في المرحلة التالية.

## ما الذي تم تنفيذه

- واجهة عربية RTL كاملة ومتجاوبة
- لوحات متعددة حسب نوع المستخدم
- API فعلي عبر Express
- قاعدة بيانات SQLite داخل المشروع
- إدارة الطلبات من الواجهة إلى قاعدة البيانات
- تصميم جاهز للإضافة والتوسعة لاحقاً

## Stack الحالي

- Frontend: HTML + CSS + JavaScript
- Build tool: Vite
- Backend: Express.js
- Database: SQLite

## هيكل المشروع

```bash
.
├── index.html
├── package.json
├── vite.config.js
├── README.md
├── public/
